version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      react:
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
          - "@types/react*"
        update-types:
          - minor
          - patch
      next:
        patterns:
          - next
          - eslint-config-next
        update-types:
          - minor
          - patch
      build-tooling:
        patterns:
          - vite
          - vinext
          - "@vitejs/*"
          - "@cloudflare/*"
          - wrangler
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
