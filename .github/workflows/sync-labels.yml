name: Repository labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/sync-labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r label; do
            name=$(jq -r '.name' <<<"$label")
            color=$(jq -r '.color' <<<"$label")
            description=$(jq -r '.description' <<<"$label")
            if gh api "repos/$GH_REPO/labels/$name" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/labels/$name" -f new_name="$name" -f color="$color" -f description="$description" >/dev/null
            else
              gh api --method POST "repos/$GH_REPO/labels" -f name="$name" -f color="$color" -f description="$description" >/dev/null
            fi
          done
